name: APK install test

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Public APK URL to install'
        required: false
        default: 'https://github.com/xspeen/VidVibe/releases/download/v1.0.5/app-release.apk'

permissions:
  contents: read

jobs:
  install:
    name: Install on API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [ 26, 30, 35 ]

    steps:
      - name: Download APK
        run: |
          curl -sSL --retry 5 --retry-all-errors -o app.apk "${{ github.event.inputs.apk_url }}"
          ls -l app.apk
          sha256sum app.apk
          unzip -t app.apk >/dev/null && echo "zip ok"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell getprop ro.build.version.release
            adb shell getprop ro.product.cpu.abilist
            adb install -r app.apk
            adb shell pm list packages | grep com.vidvibe.app
