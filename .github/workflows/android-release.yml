name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 1.0.0'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.12 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.VIDVIBE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"
            echo "VIDVIBE_KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"
            echo "Release signing enabled."
          else
            echo "No keystore secret found. The release APK will be unsigned."
          fi

      - name: Build release APK
        env:
          VIDVIBE_KEYSTORE_PASSWORD: ${{ secrets.VIDVIBE_KEYSTORE_PASSWORD }}
          VIDVIBE_KEY_ALIAS: ${{ secrets.VIDVIBE_KEY_ALIAS }}
          VIDVIBE_KEY_PASSWORD: ${{ secrets.VIDVIBE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Build debug APK as a fallback
        run: gradle :app:assembleDebug --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p release-artifacts
          find app/build/outputs/apk -name '*.apk' -print -exec cp {} release-artifacts/ \;
          ls -lh release-artifacts

      - name: Upload APKs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VidVibe-APKs
          path: release-artifacts/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            VidVibe ${{ github.ref_name }}

            Built automatically by GitHub Actions from the source at this tag.

            Assets:
            - `app-release.apk` - signed release build when repository signing secrets are configured
            - `app-release-unsigned.apk` - unsigned build when signing secrets are not configured
            - `app-debug.apk` - installable debug build

            VidVibe is free and open source under the MIT License.
