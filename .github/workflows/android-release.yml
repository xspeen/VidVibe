name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 1.0.0'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.VIDVIBE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"
            echo "VIDVIBE_KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"
            echo "Release signing enabled."
          else
            echo "No keystore secret found. The release APK will fall back to debug signing."
          fi

      - name: Build release APK
        env:
          VIDVIBE_KEYSTORE_PASSWORD: ${{ secrets.VIDVIBE_KEYSTORE_PASSWORD }}
          VIDVIBE_KEY_ALIAS: ${{ secrets.VIDVIBE_KEY_ALIAS }}
          VIDVIBE_KEY_PASSWORD: ${{ secrets.VIDVIBE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Collect release APK and source
        run: |
          mkdir -p release-artifacts
          find app/build/outputs/apk/release -name '*.apk' -print -exec cp {} release-artifacts/ \;
          (cd release-artifacts && sha256sum *.apk > SHA256SUMS.txt)
          git archive --format=zip --prefix="VidVibe-${GITHUB_REF_NAME}/" \
            -o "release-artifacts/VidVibe-${GITHUB_REF_NAME}-src.zip" HEAD
          ls -lh release-artifacts
          cat release-artifacts/SHA256SUMS.txt

      - name: Upload release APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VidVibe-release-APK
          path: release-artifacts/*
          if-no-files-found: error

      - name: Verify release APK signature
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(ls "$SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ ! -x "$APKSIGNER" ]; then
            SDKMANAGER=$(ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
            yes | "$SDKMANAGER" "build-tools;35.0.0" >/dev/null
            APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          fi
          echo "Using $APKSIGNER"
          "$APKSIGNER" verify release-artifacts/app-release.apk
          # With minSdk 24+, apksigner hides the v1 result by default, so verify
          # against API 23 to confirm the JAR signature is really present.
          "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 23 \
            release-artifacts/app-release.apk | tee apk-signature.txt
          if ! grep -q "Verified using v1 scheme (JAR signing): true" apk-signature.txt; then
            echo "::error::Release APK is missing the v1 JAR signature."
            exit 1
          fi
          if ! grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apk-signature.txt; then
            echo "::error::Release APK is missing the v2 signature."
            exit 1
          fi
          ACTUAL=$(grep -m1 "certificate SHA-256 digest" apk-signature.txt | awk '{print $NF}' | tr 'A-F' 'a-f')
          EXPECTED="f3f3bf47b222726d69061eeb390afca49abd0e60c7888bdb4093810e67b2af64"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Release APK is signed with the wrong key ($ACTUAL)."
            exit 1
          fi
          echo "Release APK is signed with the VidVibe release key."

      - name: Verify APK architecture coverage
        run: |
          APK=release-artifacts/app-release.apk
          LISTING=$(unzip -l "$APK")
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if ! echo "$LISTING" | grep -q "lib/$abi/libpython"; then
              echo "::error::Release APK is missing native libraries for $abi."
              exit 1
            fi
            echo "Found native libraries for $abi"
          done
          if echo "$LISTING" | grep -q "lib/x86/"; then
            echo "::error::Unexpected 32-bit x86 native libraries in the release APK."
            exit 1
          fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            VidVibe ${{ github.ref_name }}

            Built automatically by GitHub Actions from the source at this tag.

            What's new in 2.8.4:
            - New Audio section alongside Videos, Folders and Playlists: save music with album art and play it inside VidVibe
            - Audio downloads use yt-dlp's audio-only path and land in Music/VidVibe with tags and cover art
            - YouTube Music, Spotify, Apple Music, SoundCloud, Deezer, Tidal, Bandcamp and Audiomack links are recognised and auto-switch the downloader to audio
            - Music keeps playing after the app is closed; lock-screen, notification and Bluetooth controls come from a real media session
            - Floating mini player above the nav bar and a full-screen clay audio player with a seekable queue
            - Finished queue cards fill the whole card, show a slow-motion green tick with glow and sparkles, then remove themselves
            - Red count badges on Videos, Folders, Playlists and Audio clear with an animation when the section is opened
            - Platform logos now render on the link field, every queue card and the audio list
            - Video player: tap the centre to pause or play, swipe right for the next video and left for the previous one, with a play/pause overlay
            - The end-of-video overlay is now an opaque clay card, which removes the liquid-glass glitch around Previous and Next
            - Glassmorphism toned down across the app; new Clay background and Clay floating-menu color, plus a Moss background
            - Windows: responsive laptop layout that switches to an icon rail on narrow windows, adaptive backdrop, content column capped on wide screens

            Assets:
            - `app-release.apk` - optimized universal Android release build signed with the VidVibe release key (v1, v2, and v3 signature schemes; arm64-v8a, armeabi-v7a, and x86_64 native libraries)
            - `SHA256SUMS.txt` - checksum for verifying the APK download
            - `VidVibe-${GITHUB_REF_NAME}-src.zip` - full source tree at this tag
            - `VidVibe-<desktop version>.msi` - Windows 10/11 installer, built from the same tag
            - `VidVibe-Windows-<desktop version>.zip` - portable Windows build
            - `SHA256SUMS-Windows.txt` - checksums for the Windows downloads

            Requirements: Android 8.0 or newer on a 64-bit or 32-bit ARM phone; Windows 10 or 11 on x64.

            If Android reports "package appears to be invalid", check that the downloaded
            file size matches `SHA256SUMS.txt` - a cut-off download is the most common
            cause. If Android reports a signature error while updating, uninstall the
            previous VidVibe build first; builds before 1.0.2 used a different signing key.

            VidVibe is free and open source under the MIT License.

  windows:
    name: Build Windows installer
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false

      - name: Cache download engine
        uses: actions/cache@v4
        with:
          path: desktop/build/tools
          key: vidvibe-desktop-tools-v1

      - name: Build MSI and app image
        run: gradle -p desktop packageMsi createDistributable --stacktrace

      - name: Package portable zip and checksums
        run: |
          $version = (Select-String -Path desktop/build.gradle.kts -Pattern 'packageVersion = "([^"]+)"').Matches.Groups[1].Value
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "desktop/build/compose/binaries/main/app/VidVibe/*" -DestinationPath "dist/VidVibe-Windows-$version.zip" -Force
          $files = @(Get-ChildItem "desktop/build/compose/binaries/main/msi/*.msi") + @(Get-ChildItem "dist/*.zip")
          $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Path "dist/SHA256SUMS-Windows.txt" -Encoding ascii
          Get-Content "dist/SHA256SUMS-Windows.txt"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VidVibe-Windows-${{ github.run_number }}
          path: |
            desktop/build/compose/binaries/main/msi/*.msi
            dist/*.zip
            dist/SHA256SUMS-Windows.txt
          if-no-files-found: error

      - name: Attach Windows files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @()
          $files += Get-ChildItem "desktop/build/compose/binaries/main/msi/*.msi"
          $files += Get-ChildItem "dist/*.zip"
          $files += Get-ChildItem "dist/SHA256SUMS-Windows.txt"
          gh release upload $env:GITHUB_REF_NAME $files.FullName --clobber
