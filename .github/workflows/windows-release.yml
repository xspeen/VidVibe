name: Windows Desktop Release

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false

      - name: Cache download engine
        uses: actions/cache@v4
        with:
          path: desktop/build/tools
          key: vidvibe-desktop-tools-v1

      - name: Build MSI and app image
        run: gradle -p desktop packageMsi createDistributable --stacktrace

      - name: Package portable zip
        run: |
          $version = (Select-String -Path desktop/build.gradle.kts -Pattern 'packageVersion = "([^"]+)"').Matches.Groups[1].Value
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "desktop/build/compose/binaries/main/app/VidVibe/*" -DestinationPath "dist/VidVibe-Windows-$version.zip" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VidVibe-Windows-${{ github.run_number }}
          path: |
            desktop/build/compose/binaries/main/msi/*.msi
            dist/*.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/build/compose/binaries/main/msi/*.msi
            dist/*.zip
          generate_release_notes: true
